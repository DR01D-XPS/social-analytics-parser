<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Источники аналитики соцсетей</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="page-glow"></div>
  <header class="topbar">
    <div>
      <p class="eyebrow">СОЦИАЛЬНАЯ АНАЛИТИКА</p>
      <h1>Управление источниками</h1>
    </div>
    <nav class="nav-actions">
      <a href="/" class="btn btn-secondary">Дашборд</a>
      <a href="/sources" class="btn btn-secondary active">Источники</a>
    </nav>
  </header>

  <main class="layout">
    <section class="card source-form-card">
      <div class="card-title-row">
        <h3>Добавить источник</h3>
      </div>
      <form id="sourceForm" class="source-form">
        <label>
          <span>Платформа</span>
          <select id="platform" required>
            <option value="vk">VK</option>
            <option value="telegram">Telegram</option>
            <option value="max">MAX</option>
          </select>
        </label>
        <label>
          <span>Внешний ID</span>
          <input id="externalId" type="text" placeholder="id канала или сообщества" required />
        </label>
        <label>
          <span>Название</span>
          <input id="title" type="text" placeholder="Отображаемое название" required />
        </label>
        <label>
          <span>Режим источника</span>
          <select id="sourceMode">
            <option value="mock">mock</option>
            <option value="http">http-адаптер</option>
          </select>
          <small id="modeHint" class="field-hint">
            Для VK реальных данных: выберите `http-адаптер`, оставьте URL пустым и укажите API токен VK.
          </small>
        </label>
        <label>
          <span>Базовый URL API</span>
          <input id="apiBaseUrl" type="url" placeholder="https://adapter.domain/api" />
        </label>
        <label>
          <span>API токен</span>
          <input id="apiToken" type="password" placeholder="токен VK или токен адаптера" />
        </label>
        <div class="source-form-actions">
          <button class="btn btn-primary" type="submit">Создать источник</button>
          <span id="formStatus" class="status-text">Готово</span>
        </div>
      </form>
    </section>

    <section class="card table-card">
      <div class="card-title-row">
        <h3>Подключенные источники</h3>
      </div>
      <div class="table-scroll">
        <table id="sourcesTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Платформа</th>
              <th>Название</th>
              <th>Внешний ID</th>
              <th>Режим</th>
              <th>Статус</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/static/sources.js" type="module"></script>
</body>
</html>
